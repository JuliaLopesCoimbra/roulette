<?xml version="1.0" encoding="UTF-8"?>
<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="grad" x1="48" y1="0" x2="48" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7a93"/>
      <stop offset="1" stop-color="#fb4667"/>
    </linearGradient>
  </defs>

  <!-- shaft -->
  <rect x="44" y="10" width="8" height="34" rx="4" fill="url(#grad)" filter="url(#glow)"/>
  <!-- arrow head (downwards) -->
  <path d="M48 86 L28 58 Q48 64 68 58 Z" fill="url(#grad)" filter="url(#glow)"/>
  <!-- subtle outline -->
  <path d="M48 86 L28 58 Q48 64 68 58 Z" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2"/>
</svg>
